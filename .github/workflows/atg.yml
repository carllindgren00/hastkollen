name: Hämta från ATG

# GitHubs schema går i UTC. Svensk vintertid är UTC+1, sommartid UTC+2.
on:
  schedule:
    - cron: "17 18 * * 1-5"            # vardagar 19:17 vintertid: startlista och odds när spelet öppnar
    - cron: "37 8 * * 6,0"             # lör/sön 09:37 vintertid: spara odds + uppdatera
    - cron: "7,22,37,52 10-13 * * 6,0" # lör/sön var 15:e minut 11:07–14:52 vintertid, fram till start
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Spara även dagens odds i loggen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .cache
          key: atg-cache-${{ github.run_id }}
          restore-keys: atg-cache-

      - name: Installera kryptering
        run: |
          python3 -m pip install --quiet "cryptography>=42" || python3 -m pip install --quiet --user --break-system-packages "cryptography>=42"

      # Klartext hamnar bara i .work/, som aldrig sparas i repot. Det som sparas är krypterat.
      - name: Spara odds före start
        if: (github.event_name == 'schedule' && github.event.schedule != '17 18 * * 1-5') || inputs.snapshot
        run: |
          python3 scripts/atg_snapshot.py .work/snaps
          python3 scripts/seal.py snapshots .work/snaps docs/data/snapshots

      - name: Hämta omgångar och startlista
        run: |
          # ett nytt försök efter en minut om ATG svarar fel
          python3 -I scripts/atg_v85.py .cache .work/v85.json || { sleep 60; python3 -I scripts/atg_v85.py .cache .work/v85.json; }
          python3 scripts/seal.py file .work/v85.json docs/data/v85.enc 2> .work/seal.err || { echo "::error::$(tr '\n' ' ' < .work/seal.err)"; exit 1; }

      # sparar loggade odds även om hämtningen ovan misslyckades
      - name: Spara i repot
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "Inget nytt från ATG."; exit 0; fi
          git commit -m "ATG-data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
