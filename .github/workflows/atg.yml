name: Hämta från ATG

# GitHubs schema går i UTC. Svensk vintertid är UTC+1, sommartid UTC+2.
on:
  schedule:
    - cron: "17 18 * * 1-5"    # vardagar 19:17 vintertid: startlista och odds när spelet öppnar
    - cron: "37 8 * * 6,0"     # lör/sön 09:37 vintertid: spara odds + uppdatera
    - cron: "37 11 * * 6,0"    # 12:37
    - cron: "17 12 * * 6,0"    # 13:17
    - cron: "57 12 * * 6,0"    # 13:57, sista före start (15:00) vintertid
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Spara även dagens odds i loggen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .cache
          key: atg-cache-${{ github.run_id }}
          restore-keys: atg-cache-

      - name: Spara odds före start
        if: (github.event_name == 'schedule' && github.event.schedule != '17 18 * * 1-5') || inputs.snapshot
        run: python3 -I scripts/atg_snapshot.py public/data/snapshots

      - name: Hämta omgångar och startlista
        run: python3 -I scripts/atg_v85.py .cache public/data/v85.json

      - name: Spara i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then echo "Inget nytt från ATG."; exit 0; fi
          git commit -m "ATG-data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
